<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Store 地区切换</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="header-brand">
        <img class="brand-icon" src="icons/icon32.png" alt="">
        <div class="brand-info">
          <h1 class="brand-title">App Store 地区切换</h1>
          <span class="brand-tag">打开苹果官网，只改网址里的地区</span>
        </div>
      </div>
      <div class="header-version">v3.2</div>
    </header>

    <section class="card">
      <div class="card-header">
        <span class="card-title">当前页面</span>
        <span class="badge" id="currentRegionBadge">检测中...</span>
      </div>
      <div class="tab-info" id="tabInfo">正在检测当前网页...</div>
      <div class="chips-container" id="popupQuickChips"></div>
      <div class="dropdown-row">
        <select id="popupAllRegionsSelect" class="form-select" aria-label="更多地区"></select>
        <button id="popupSwitchTabBtn" class="btn btn-primary btn-sm" type="button">打开</button>
      </div>
      <div class="search-input-group">
        <select id="searchRegionSelect" class="form-select search-region-select" aria-label="搜索地区"></select>
        <input type="text" id="searchAppInput" class="form-input" placeholder="搜索 App 名称或 ID">
        <button id="searchAppBtn" class="btn btn-primary" type="button">搜索</button>
      </div>
      <div class="search-loading hidden" id="searchLoading">正在检索 App Store...</div>
      <div class="search-results hidden" id="searchResults"></div>
    </section>

    <section class="card">
      <div class="card-header">
        <span class="card-title">官网线路</span>
      </div>
      <p class="link-status" id="linkStatus">正在检查本机转发...</p>
      <div class="setting-item" id="proxyRow">
        <div class="setting-text">
          <div class="setting-name">使用本机转发</div>
          <div class="setting-desc">只把 apps.apple.com 交给 127.0.0.1:17890</div>
        </div>
        <label class="switch">
            <input type="checkbox" id="proxyRoutingToggle" aria-label="使用本机转发">
          <span class="slider"></span>
        </label>
      </div>
      <div class="hosts-box" id="linkHelp">
        <div class="hosts-title">页面被送回中国区时，任选一种：</div>
        <div class="hosts-code-row">
          <code>151.101.3.6 apps.apple.com</code>
          <button id="copyHostsCmdBtn" class="btn btn-sm btn-primary" type="button">复制命令</button>
        </div>
        <div class="hosts-desc">没开系统代理时，把这一行写入本机域名表。已经开着 Clash 或 TUN 时，在项目目录运行 <code>node direct-proxy.mjs</code>，再打开上面的开关。</div>
      </div>
    </section>

    <footer class="popup-footer">
      <button class="footer-btn" id="openTodayBtn" type="button">今日</button>
      <button class="footer-btn" id="openChartsBtn" type="button">排行榜</button>
    </footer>
  </div>

  <script src="regions.js"></script>
  <script src="storefront.js"></script>
  <script src="popup.js"></script>
</body>
</html>
